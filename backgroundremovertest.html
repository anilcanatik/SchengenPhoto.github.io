<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Local Background Removal (Visa Photo Example)</title>
  <!-- Make the page responsive and look decent -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      text-align: center;
    }
    h1 {
      margin-bottom: 1rem;
    }
    input[type="file"] {
      margin: 1rem 0;
    }
    #originalImage,
    #resultCanvas {
      max-width: 300px;
      max-height: 400px;
      margin: 1rem auto;
      display: block;
    }
    #loadingMessage {
      font-style: italic;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>Local Background Removal</h1>
  <p>Upload an image (e.g., a portrait/visa photo) to remove the background in-browser.</p>

  <!-- File input -->
  <input id="imageUpload" type="file" accept="image/*" />

  <!-- Original image display -->
  <img id="originalImage" alt="Original" />

  <!-- Loading message (hidden by default) -->
  <p id="loadingMessage" style="display: none;">Loading TensorFlow model and processing image...</p>

  <!-- Canvas for the output result -->
  <canvas id="resultCanvas"></canvas>

  <!-- TensorFlow.js and BodyPix library from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.20.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2.2.0"></script>

  <script>
    // DOM elements
    const fileInput = document.getElementById('imageUpload');
    const originalImage = document.getElementById('originalImage');
    const resultCanvas = document.getElementById('resultCanvas');
    const loadingMessage = document.getElementById('loadingMessage');

    let bodyPixModel = null; // Will hold the loaded BodyPix model

    /**
     * Loads the BodyPix model (only once) the first time an image is uploaded.
     * Returns a Promise that resolves to the loaded model.
     */
    async function loadBodyPixModel() {
      if (bodyPixModel) {
        // If already loaded, return the existing model
        return bodyPixModel;
      }
      // Otherwise, load the model
      loadingMessage.style.display = 'block';
      bodyPixModel = await bodyPix.load({
        // You can tweak these parameters for performance/accuracy tradeoffs.
        // For example: architecture: 'MobileNetV1', outputStride: 16, multiplier: 0.75, etc.
      });
      return bodyPixModel;
    }

    /**
     * Removes background from the given image element using BodyPix.
     * Draws the processed image on the resultCanvas with a white background.
     */
    async function removeBackground(imageEl) {
      // Load or retrieve the BodyPix model
      const model = await loadBodyPixModel();

      // Segment person
      const segmentation = await model.segmentPerson(imageEl, {
        internalResolution: 'medium', 
        segmentationThreshold: 0.7,
      });

      // Create an offscreen canvas to manipulate pixels
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      // Match the canvas size to the image
      canvas.width = imageEl.naturalWidth;
      canvas.height = imageEl.naturalHeight;
      ctx.drawImage(imageEl, 0, 0);

      // Extract image pixel data
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;
      // segmentation.data[i] = 1 if pixel belongs to the person
      // segmentation.data[i] = 0 otherwise
      for (let i = 0; i < data.length; i += 4) {
        const n = i / 4;
        // If this pixel is not part of the person, make it white
        if (!segmentation.data[n]) {
          data[i] = 255;     // R
          data[i + 1] = 255; // G
          data[i + 2] = 255; // B
        }
      }
      // Put updated data back on the canvas
      ctx.putImageData(imageData, 0, 0);

      // Now draw the result in the visible canvas
      const resultCtx = resultCanvas.getContext('2d');
      // Resize the visible canvas to match final output
      resultCanvas.width = imageEl.naturalWidth;
      resultCanvas.height = imageEl.naturalHeight;
      resultCtx.drawImage(canvas, 0, 0);
    }

    // Listen for file input changes
    fileInput.addEventListener('change', async () => {
      if (!fileInput.files || fileInput.files.length === 0) return;

      const file = fileInput.files[0];
      if (!file.type.startsWith('image/')) {
        alert('Please select an image file.');
        return;
      }

      // Display the original image
      const reader = new FileReader();
      reader.onload = (e) => {
        originalImage.src = e.target.result;
      };
      reader.readAsDataURL(file);

      // Once the image is loaded, remove the background
      originalImage.onload = async () => {
        loadingMessage.style.display = 'block'; // Show "Loading..."
        await removeBackground(originalImage);
        loadingMessage.style.display = 'none'; // Hide "Loading..."
      };
    });
  </script>
</body>
</html>
